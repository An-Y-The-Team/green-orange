name: E2E

# On demand only. The suite needs a Postgres, both builds and a browser
# download (~5 min), and it asserts against the seeded demo dataset — none of
# which belongs in the per-PR gate (ci.yml). Run it from the Actions tab, with
# `gh workflow run e2e.yml --ref <branch>`, or by putting the `e2e` label on a PR.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: crm-web · playwright
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'e2e'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: crm_nest
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # Read by prisma (migrate) and by the API the Playwright config boots.
      DATABASE_URL: postgresql://postgres:password@localhost:5432/crm_nest
      JWT_SECRET: e2e-only

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14 # same pin as ci.yml — the text lockfile needs Bun >=1.2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # The browser download is the slowest step; keyed on the lockfile so it
      # only re-downloads when @playwright/test moves.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      - name: Migrate the E2E database
        working-directory: apps/crm-api-nest
        run: bun run migrate

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # Builds both apps, seeds the demo dataset, then runs the suite. The
      # Playwright config boots the API + web server itself (ports 8011/3012).
      - name: Run E2E
        working-directory: apps/crm-web
        run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/crm-web/playwright-report
          retention-days: 7
